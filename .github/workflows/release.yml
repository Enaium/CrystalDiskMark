name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0). Leave empty to auto-generate v<timestamp>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Resolve tag
        run: |
          tag="${{ github.event.inputs.version }}"
          if [ -z "$tag" ]; then tag="v$(date +%Y%m%d%H%M%S)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --generate-notes \
            --repo "$GITHUB_REPOSITORY" || true

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            task: linkReleaseExecutableMacosArm64
            src: app/build/bin/macosArm64/releaseExecutable/app.kexe
            asset: CrystalDiskMark-macos-arm64.kexe
          - name: macOS (x64)
            os: macos-14
            task: linkReleaseExecutableMacosX64
            src: app/build/bin/macosX64/releaseExecutable/app.kexe
            asset: CrystalDiskMark-macos-x64.kexe
          - name: Linux (x64)
            os: ubuntu-24.04
            task: linkReleaseExecutableLinuxX64
            src: app/build/bin/linuxX64/releaseExecutable/app.kexe
            asset: CrystalDiskMark-linux-x64.kexe
          # Kotlin/Native has no linux-aarch64 host support, so the
          # arm64 executable is cross-compiled from the x86_64 runner.
          - name: Linux (arm64)
            os: ubuntu-24.04
            task: linkReleaseExecutableLinuxArm64
            src: app/build/bin/linuxArm64/releaseExecutable/app.kexe
            asset: CrystalDiskMark-linux-arm64.kexe
          - name: Windows (x64)
            os: windows-latest
            task: linkReleaseExecutableMingwX64
            src: app/build/bin/mingwX64/releaseExecutable/app.exe
            asset: CrystalDiskMark-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native executable
        shell: bash
        run: ./gradlew --no-daemon --stacktrace "${{ matrix.task }}"
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.src }}" "dist/${{ matrix.asset }}"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/${{ matrix.asset }}

  android:
    name: Build Android APK
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Kotlin/Native Android toolchain
        shell: bash
        # The first native invocation downloads the K/N Android toolchain
        # into ~/.konan. konanAndroidLibDir() in app/build.gradle.kts
        # resolves the sysroot -L path at configuration time, so the
        # toolchain must exist before the APK build configures. Compile
        # (not link) to avoid the -laudio link error on this warm-up run.
        run: ./gradlew --no-daemon --stacktrace :app:compileKotlinAndroidNativeArm32
      - name: Build release APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :android:assembleRelease
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: android/build/outputs/apk/release/*.apk
